name: Verify Python and browser workbench

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q warfarin_titration.py agents tests enrichment.py
      - name: Run Python regression tests
        run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check browser code
        run: node --check web/calculator.js
      - name: Run browser core tests
        run: node --test web/tests/calculator.test.cjs
      - name: Check for external runtime dependencies
        run: |
          if grep -E 'https?://[^ "]*\.js|fetch\(' web/index.html web/calculator.js; then
            echo "Unexpected network dependency in browser app"; exit 1
          fi
